<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="Fused GPU kernels with in-kernel automatic differentiation in JAX and Pallas, outperforming Dynamax, NVIDIA Warp and the Newton physics engine on their own official examples in state estimation and model-predictive control.">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="Fused GPU kernels with in-kernel automatic differentiation in JAX and Pallas, outperforming Dynamax, NVIDIA Warp and the Newton physics engine on their own official examples in state estimation and model-predictive control.">
<meta property="og:type" content="article">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #59636e;
    --accent: #1f5fa8;
    --rule: #d8dee4;
    --code-bg: #f6f8fa;
    --quote-bg: #f1f6fc;
    --table-head: #f6f8fa;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* layout: the article is centred on the page, the contents list is pinned to the left edge */
  .layout { padding: 0 16px; }
  .content { max-width: 800px; margin: 0 auto; }

  /* table of contents (hidden on narrow screens) */
  nav.toc { display: none; }
  @media (min-width: 1100px) {
    nav.toc {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 270px;
      height: 100vh;
      overflow-y: auto;
      padding: 40px 16px 24px 24px;
      border-right: 1px solid var(--rule);
      background: var(--bg);
      font-size: 14px;
      line-height: 1.45;
    }
    .content { margin-left: 310px; margin-right: 24px; }   /* not enough room to centre: sit right of the list */
  }
  @media (min-width: 1420px) {
    .content { margin: 0 auto; }                          /* wide screens: exactly centred */
  }
  nav.toc .toc-title { font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 12px; margin-bottom: 10px; }
  nav.toc ul { list-style: none; margin: 0; padding: 0; }
  nav.toc > ul > li { margin: 6px 0; display: grid; grid-template-columns: 18px minmax(0, 1fr); align-items: start; }
  nav.toc > ul > li > a { grid-column: 2; }
  nav.toc > ul > li > ul { grid-column: 2; }
  nav.toc ul ul { display: none; padding-left: 10px; border-left: 1px solid var(--rule); margin: 4px 0 8px; }
  nav.toc li.open > ul { display: block; }
  nav.toc ul ul li { margin: 3px 0; }
  nav.toc a { color: var(--muted); display: block; padding-left: 6px; border-left: 2px solid transparent; margin-left: -8px; }
  nav.toc ul ul a { margin-left: -12px; }
  nav.toc a:hover { color: var(--accent); text-decoration: none; }
  nav.toc a.active { color: var(--accent); font-weight: 600; border-left-color: var(--accent); }
  nav.toc .toggle {
    grid-column: 1; grid-row: 1;
    width: 18px; height: 22px; padding: 0; border: 0; background: none; cursor: pointer;
    color: var(--muted); font-size: 11px; line-height: 22px; transition: transform .15s;
  }
  nav.toc .toggle:hover { color: var(--accent); }
  nav.toc li.open > .toggle { transform: rotate(90deg); }

  /* article */
  header.page { padding: 48px 0 8px; }
  header.page h1 { font-size: 2.1rem; line-height: 1.25; margin: 0 0 8px; letter-spacing: -0.01em; }
  main { padding-bottom: 80px; min-width: 0; }
  main h2 { font-size: 1.55rem; margin: 2.4em 0 .6em; padding-bottom: .3em; border-bottom: 1px solid var(--rule); line-height: 1.3; }
  main h3 { font-size: 1.2rem; margin: 1.8em 0 .5em; line-height: 1.35; }
  main h2, main h3 { scroll-margin-top: 16px; }
  main p, main li { overflow-wrap: anywhere; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5em 0; }
  blockquote {
    margin: 1.2em 0;
    padding: .7em 1em;
    background: var(--quote-bg);
    border-left: 4px solid var(--accent);
    border-radius: 0 6px 6px 0;
    color: var(--fg);
  }
  blockquote p { margin: 0; }

  code { font: 0.88em/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code-bg); padding: .12em .35em; border-radius: 4px; }
  pre { background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; overflow-x: auto; line-height: 1.45; }
  pre code { background: none; padding: 0; font-size: 0.84em; }
  pre code.hljs { background: none; padding: 0; }

  .table-wrap { overflow-x: auto; margin: 1.2em 0; }
  table { border-collapse: collapse; font-size: 0.92em; min-width: 100%; }
  th, td { border: 1px solid var(--rule); padding: 7px 11px; vertical-align: top; }
  th { background: var(--table-head); text-align: left; font-weight: 600; }

  figure { margin: 1.6em 0; text-align: center; }
  figure img { max-width: 100%; height: auto; }
  figcaption { color: var(--muted); font-size: 0.9em; margin-top: 6px; }

  .arithmatex { overflow-x: auto; overflow-y: hidden; }
  div.arithmatex { margin: 1em 0; padding: 2px 0; }
  .katex { font-size: 1.05em; }

  footer { color: var(--muted); font-size: 14px; border-top: 1px solid var(--rule); padding: 20px 0 40px; margin-top: 40px; }
</style>
</head>
<body>
<div class="layout">
  <nav class="toc" aria-label="Contents">
    <div class="toc-title">Contents</div>
    {{toc}}
  </nav>
  <div class="content">
    <header class="page">
      <h1>{{title_html}}</h1>
    </header>
    <main>
{{body}}
    </main>
    <footer>
      © 2026 Thribhuvan Rapolu · Code under the Apache License 2.0 ·
      <a href="https://github.com/thribhuvanrapolu/accelerating-higher-order-autodiff">GitHub repository</a>
    </footer>
  </div>
</div>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  window.addEventListener("DOMContentLoaded", function () {
    // math: pymdownx.arithmatex wrapped every formula in \( \) or \[ \]
    document.querySelectorAll(".arithmatex").forEach(function (el) {
      renderMathInElement(el, {
        delimiters: [{left: "\\[", right: "\\]", display: true}, {left: "\\(", right: "\\)", display: false}],
        throwOnError: false
      });
    });
    // code: colour only the languages highlight.js knows (bibtex stays plain)
    document.querySelectorAll("pre code").forEach(function (el) {
      var lang = (el.className.match(/language-(\w+)/) || [])[1];
      if (lang && hljs.getLanguage(lang)) { hljs.highlightElement(el); }
    });
  });

  // Table of contents: collapsible sections that follow the reader (accordion: one section open at a time)
  (function () {
    var nav = document.querySelector("nav.toc");
    var sections = Array.prototype.slice.call(nav.querySelectorAll(":scope > ul > li"));

    // an arrow button in front of every section that has subsections
    sections.forEach(function (li) {
      if (!li.querySelector("ul")) { return; }
      var button = document.createElement("button");
      button.className = "toggle";
      button.type = "button";
      button.setAttribute("aria-label", "Show or hide subsections");
      button.textContent = "▶";
      button.addEventListener("click", function () { li.classList.toggle("open"); });
      li.insertBefore(button, li.firstChild);
    });

    // clicking a section title also opens its subsections
    sections.forEach(function (li) {
      li.querySelector(":scope > a").addEventListener("click", function () { openOnly(li); });
    });

    function openOnly(li) {
      sections.forEach(function (other) { other.classList.toggle("open", other === li); });
    }

    // map every heading in the page to its link (and its top-level section) in the table of contents
    var entries = [];
    nav.querySelectorAll("a[href^='#']").forEach(function (a) {
      var heading = document.getElementById(decodeURIComponent(a.getAttribute("href").slice(1)));
      if (heading) { entries.push({heading: heading, link: a, section: a.closest("nav.toc > ul > li")}); }
    });

    var currentSection = null;
    function update() {
      var current = entries[0];
      entries.forEach(function (e) { if (e.heading.getBoundingClientRect().top < 120) { current = e; } });
      if (!current) { return; }
      nav.querySelectorAll("a.active").forEach(function (a) { a.classList.remove("active"); });
      current.link.classList.add("active");
      var sectionLink = current.section.querySelector(":scope > a");
      if (sectionLink !== current.link) { sectionLink.classList.add("active"); }
      if (current.section !== currentSection) {        // entering a new section: open it, close the others
        currentSection = current.section;
        openOnly(currentSection);
      }
      // keep the highlighted entry visible inside the (scrollable) table of contents
      var box = nav.getBoundingClientRect(), item = current.link.getBoundingClientRect();
      if (item.top < box.top + 40 || item.bottom > box.bottom - 40) {
        nav.scrollTop += item.top - box.top - box.height / 3;
      }
    }

    window.addEventListener("scroll", update, {passive: true});   // cheap: about 50 headings
    window.addEventListener("hashchange", update);
    window.addEventListener("load", update);
    update();
  })();
</script>
</body>
</html>
